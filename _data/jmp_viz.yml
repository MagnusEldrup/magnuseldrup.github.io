# Text for the "Main results, visualized" panel in the JMP card on the homepage.
# Rendered by _includes/jmp-viz.html. What the chart shows in each step (curves,
# arrows, labels) is defined in assets/js/jmp-viz.js (STEPS and makeNotes), so
# keep the five steps in the same order in both places.
# HTML is allowed in `headline`, `note`, `source` and `definition`.
#   note:       optional line shown next to the source (e.g. an intuition)
#   definition: optional boxed definition shown on the chart for that step
steps:
  - short: Exemptions in practice
    headline: >-
      Developing countries have large tax exemptions, routinely covering
      above the 80th percentile of earnings.
    source: >-
      Source: <a href="https://doi.org/10.1257/aer.20191528">Jensen (2022)</a>,
      <em>American Economic Review</em>.

  - short: Standard models
    headline: Standard optimal tax models prescribe no tax exemptions.
    source: >-
      See <a href="https://doi.org/10.2307/2297322">Sadka (1976)</a>;
      <a href="https://doi.org/10.2307/2297292">Seade (1982)</a>;
      <a href="https://doi.org/10.1257/jep.23.4.147">Mankiw, Weinzierl &amp; Yagan (2009)</a>.

  - short: Informality alone
    headline: >-
      Accounting for informality on its own only moves prescribed policy
      further away from the observed reality in developing countries.
    note: >-
      <strong>Intuition:</strong> This is similar to a forced tagged tax system
      where the planner chooses only to tax the formal workers. Since these
      workers have higher incomes, higher tax rates are merited.
    source: >-
      Source: Eldrup (2026), <a href="/assets/horizontal-inequality.pdf">Figure 4</a>.

  - short: Horizontal inequality
    headline: >-
      In my paper, I account for the fact that taxation in high-informality
      economies leads to <em>horizontal inequality</em>. I measure social
      preferences accounting for this horizontal inequality directly.
      Incorporating these preferences rationalizes sizeable exemptions.
    definition:
      title: Horizontal inequality
      body: >-
        The unequal treatment of equals (Musgrave, 1990). In my paper: workers
        with the same skill who face different tax liabilities because one
        works formally and the other informally.
    source: >-
      Source: Eldrup (2026), <a href="/assets/horizontal-inequality.pdf">Figure 4</a>.
      Shaded band: 95% confidence interval.

  - short: Admin costs and extensive margin
    headline: >-
      While administrative costs and extensive-margin responses increase the
      size of the prescribed exemption somewhat, they cannot, by themselves,
      rationalize sizeable exemptions.
    source: >-
      Source: Eldrup (2026), <a href="/assets/horizontal-inequality.pdf">Figure 5</a>.
      Dashed: participation elasticity 0.5 and admin cost of 5,000 Ksh per taxpayer.
      Dotted: elasticity 1 and 10,000 Ksh.
